<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AURA GUIDE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="system-header">

            <img
                src="assets/aura-logo.svg"
                alt="AURA"
                class="aura-logo"
            >

            <div class="system-line">
                <span>AURA.SYSTEM</span>
                <span class="online">● ONLINE</span>
            </div>

            <div class="system-subtitle">
                GUIDE / USER INTERFACE
            </div>

        </header>


        <section class="welcome">

            <div class="section-number">
                SYSTEM / 01
            </div>

            <h1>
                ПРИВЕТ,<br>
                ПОЛЬЗОВАТЕЛЬ.
            </h1>

            <p>
                Система навигации форума первокурсников AURA.
            </p>

            <div class="user-status">
                <span>USER STATUS</span>
                <strong>ПЕРВОКУРСНИК</strong>
            </div>

        </section>


        <nav class="menu">

            <button>
                <span>01 / СТАРТ</span>
                <span>→</span>
            </button>

            <button>
                <span>02 / МОЙ ПУТЬ</span>
                <span>→</span>
            </button>

            <button>
                <span>03 / ЧЕК-ЛИСТ</span>
                <span>0 / 8</span>
            </button>

            <button class="locked">
                <span>04 / ЗАДАНИЯ</span>
                <span>ОЖИДАНИЕ</span>
            </button>

            <button class="locked">
                <span>05 / РАСПИСАНИЕ</span>
                <span>ОЖИДАНИЕ</span>
            </button>

        </nav>


        <section class="auri-panel">

            <div>
                <small>VIRTUAL ASSISTANT</small>
                <strong>AURI</strong>
            </div>

            <span>STATUS / ONLINE</span>

        </section>


        <footer>
            AURA / RUDN / 2026
        </footer>

    </main>


    <script src="app.js"></script>

</body>
</html>
